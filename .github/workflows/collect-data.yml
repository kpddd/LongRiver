name: Collect LongRiver data

on:
  schedule:
    # GitHub cron uses UTC. Run at minute 20 and 50 of every hour.
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: longriver-data-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Fetch, test and commit data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect latest observations
        timeout-minutes: 5
        run: python -u main.py

      - name: Commit data changes
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data)" ]]; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          git commit -m "chore(data): update LongRiver observations"

          if ! git push origin HEAD:master; then
            echo "Remote master advanced; rebasing the data commit once."
            git pull --rebase origin master
            git push origin HEAD:master
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    name: Deploy updated data to Pages
    needs: collect
    if: needs.collect.outputs.data_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: master
