name: Collect LongRiver data

on:
  schedule:
    # GitHub cron uses UTC. Run at minute 20 and 50 of every hour.
    - cron: "20,50 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/collect-data.yml"
      - ".github/workflows/collect-runner.yml"
      - "longriver.py"
      - "main.py"
      - "tests/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: longriver-data-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Primary collection
    uses: ./.github/workflows/collect-runner.yml
    with:
      runner: ubuntu-latest

  fallback:
    name: Retry collection on a different runner pool
    needs: collect
    # Only source collection is recoverable. Setup, tests and push failures stay fatal.
    if: needs.collect.outputs.collected == 'false'
    uses: ./.github/workflows/collect-runner.yml
    with:
      runner: macos-15

  verify:
    name: Require successful live collection
    needs: [collect, fallback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      data_changed: ${{ needs.collect.outputs.data_changed == 'true' || needs.fallback.outputs.data_changed == 'true' }}
    steps:
      - name: Check collection result
        env:
          PRIMARY_RESULT: ${{ needs.collect.result }}
          PRIMARY_COLLECTED: ${{ needs.collect.outputs.collected }}
          FALLBACK_RESULT: ${{ needs.fallback.result }}
          FALLBACK_COLLECTED: ${{ needs.fallback.outputs.collected }}
        run: |
          if [[ "$PRIMARY_RESULT" == "success" && "$PRIMARY_COLLECTED" == "true" ]]; then
            echo "Live observations collected on the primary runner." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PRIMARY_RESULT" == "success" && "$FALLBACK_RESULT" == "success" && "$FALLBACK_COLLECTED" == "true" ]]; then
            echo "Live observations recovered on the fallback runner." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No successful live collection. Check source connectivity and collection logs; existing data has been preserved."
            exit 1
          fi

  deploy-pages:
    name: Deploy updated data to Pages
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.data_changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: master
