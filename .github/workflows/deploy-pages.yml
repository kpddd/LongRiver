name: Deploy LongRiver Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build after data collection
        required: false
        default: master
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: master
        type: string
  push:
    branches:
      - master
    paths:
      - "site/**"
      - "data/**"
      - "tests/**"
      - "longriver.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: longriver-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build static site
        run: npm run build
        working-directory: site

      - name: Generate browser data bundle
        run: python site/scripts/build_site_data.py --input data --output .codex/outputs/pages/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .codex/outputs/pages

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
